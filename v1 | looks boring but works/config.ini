; LMS configuration
; -----------------------------------------------------------------
; host_mode:
;   localhost  -> only reachable from this machine (127.0.0.1)
;   lan        -> reachable from any device on your local network
; -----------------------------------------------------------------
[server]
host_mode = localhost
port = 8000

[crawler]
; max concurrent requests *per server* (be polite to small boxes)
concurrency_per_server = 5
; per-request timeout, seconds
request_timeout = 15
; safety net so a misbehaving server can't recurse forever
max_depth = 15
