<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMS — Local Media Search</title>
<link rel="stylesheet" href="/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand-mark">lms</div>
    <div class="brand-tag">— search across your local media servers, instantly</div>
  </div>

  <div class="search-shell" id="searchShell">
    <span class="search-prompt">search&gt;</span>
    <input id="searchInput" type="text" placeholder="type a file or folder name, press Enter…" autocomplete="off" spellcheck="false">
    <span class="search-hint">↵ Enter</span>
  </div>

  <div class="statsline" id="statsLine">loading index stats…</div>

  <div class="body-grid">
    <aside class="filters" id="filters">
      <h3>Filter results</h3>

      <label class="check-row">
        <input type="checkbox" data-key="folders">
        <span class="swatch folder"></span> Folders
      </label>

      <div class="filter-divider"></div>

      <div class="check-row">
        <input type="checkbox" data-parent="video">
        <span class="swatch video"></span> Video files
        <button type="button" class="expand-btn" data-toggle="video">▸</button>
      </div>
      <div id="videoChildren"></div>

      <div class="filter-divider"></div>

      <div class="check-row">
        <input type="checkbox" data-parent="subtitle">
        <span class="swatch sub"></span> Subtitles
        <button type="button" class="expand-btn" data-toggle="subtitle">▸</button>
      </div>
      <div id="subChildren"></div>

      <div class="filter-divider"></div>

      <label class="check-row">
        <input type="checkbox" data-key="other">
        <span class="swatch other"></span> Other files
      </label>
    </aside>

    <main class="results" id="results">
      <div class="empty-state">Type above and press Enter to search your indexed media servers.</div>
    </main>
  </div>

  <footer class="hint">LMS — a local search index for your own directory-listing media servers. Nothing leaves this network.</footer>
</div>

<script src="/app.js"></script>
</body>
</html>
